<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>A sky just for you</title>
    <meta name="description" content="Open it when it's dark." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070b1f" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-64.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="A sky just for you" />
    <meta property="og:description" content="Open it when it's dark." />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* critique : l'intro s'affiche avant le chargement du JavaScript */
      html, body { margin: 0; height: 100%; background: #070b1f; color: #eef0ff; overflow: hidden; }
      #intro {
        position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: radial-gradient(120% 80% at 50% 108%, #2a1a4a 0%, #171238 34%, #0a0e27 68%, #060918 100%);
      }
    </style>
  </head>
  <body>
    <canvas id="sky" aria-label="The starry sky"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>

    <div id="hud" class="is-hidden">
      <div id="progress" role="status"></div>
      <button id="sound" type="button" aria-label="Mute sound" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4z" />
          <path class="wave" d="M15.5 9.2c.9.8 1.4 1.7 1.4 2.8s-.5 2-1.4 2.8" />
          <path class="wave" d="M18.2 6.8c1.6 1.4 2.5 3.2 2.5 5.2s-.9 3.8-2.5 5.2" />
          <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" />
        </svg>
      </button>
      <p id="hint"></p>
      <p id="place"></p>
    </div>

    <div id="card" role="dialog" aria-live="polite" aria-hidden="true">
      <span class="card-grab" aria-hidden="true"></span>
      <p class="card-kicker"></p>
      <p class="card-text"></p>
    </div>

    <div id="finale" aria-hidden="true">
      <p class="f-kicker"></p>
      <h1 class="f-name"></h1>
      <p class="f-msg"></p>
      <p class="f-sign"></p>
      <button id="again" type="button"></button>
    </div>

    <div id="intro">
      <div class="intro-stars" aria-hidden="true"></div>
      <div class="intro-text">
        <svg class="intro-orn" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 1.5c.5 6.2 2.3 9 9 10.500-6.700 1.500-8.500 4.300-9 10.500-.500-6.200-2.300-9-9-10.500 6.700-1.500 8.500-4.300 9-10.500z" fill="currentColor" />
        </svg>
        <p class="intro-line" id="intro-line"></p>
      </div>
      <button id="start" type="button"><span></span></button>
    </div>

    <div id="rotate" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <rect x="16" y="8" width="16" height="32" rx="3" />
        <path d="M22 35.500h4" />
      </svg>
      <p></p>
    </div>

    <div id="debug" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
